name: tests
on: [push, pull_request]
jobs:
  reference-solution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mock OA reference solution scores 800/800
        working-directory: mock_oa
        run: |
          python tests.py --solution | tee out.txt && grep -q "SCORE: 800/800" out.txt
      - name: Drill answers all pass
        run: python drills/verify_answers.py
